<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="og-grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="og-grad-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="og-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  
  <!-- Gradient background shapes -->
  <circle cx="200" cy="150" r="200" fill="url(#og-grad-main)" opacity="0.1"/>
  <circle cx="1000" cy="500" r="250" fill="url(#og-grad-main)" opacity="0.08"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#666" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Main "A" logo -->
  <g filter="url(#og-glow)">
    <!-- Left diagonal -->
    <path d="M 150 450 L 300 100 L 380 450 Z" fill="none" stroke="url(#og-grad-text)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Horizontal bar -->
    <line x1="180" y1="280" x2="350" y2="280" stroke="url(#og-grad-text)" stroke-width="18" stroke-linecap="round"/>
  </g>
  
  <!-- Main text -->
  <text x="500" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">
    Arooj Shahzadi
  </text>
  
  <!-- Tagline -->
  <text x="500" y="280" font-family="Arial, sans-serif" font-size="42" fill="#ccc">
    Teacher • Artist • Designer • BSSE
  </text>
  
  <!-- Subtitle -->
  <text x="500" y="360" font-family="Arial, sans-serif" font-size="32" fill="#888">
    Crafting Luxe, Glowing Experiences
  </text>
  
  <!-- Stats section -->
  <g>
    <text x="500" y="480" font-family="Arial, sans-serif" font-size="20" fill="#06b6d4">
      ✨ 50+ Projects
    </text>
    <text x="500" y="530" font-family="Arial, sans-serif" font-size="20" fill="#ec4899">
      ⏱️ 3+ Years Experience
    </text>
    <text x="500" y="580" font-family="Arial, sans-serif" font-size="20" fill="#8b5cf6">
      💯 100% Passion
    </text>
  </g>
  
  <!-- Top right accent -->
  <circle cx="1100" cy="80" r="4" fill="#ec4899" opacity="0.8"/>
  <circle cx="1120" cy="100" r="3" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="1080" cy="110" r="2" fill="#06b6d4" opacity="0.4"/>
</svg>